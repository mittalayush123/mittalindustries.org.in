name: Fix footer branding
on:
  push:
    paths:
      - '.github/workflows/fix-footer.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace footer branding with logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=['index.html','about.html','products.html','distribution.html','contact.html']
          replacement='<div class="footer-brand"><img src="images/logo.png" alt="Mittal Industries Logo" class="footer-logo"></div>'
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s2=re.sub(r'<div class="footer-brand">.*?</div>', replacement, s, count=1, flags=re.S)
              if s2 == s:
                  raise SystemExit(f'Footer brand not found in {name}')
              p.write_text(s2, encoding='utf-8')
          css=Path('style.css')
          s=css.read_text(encoding='utf-8')
          marker='/* FOOTER LOGO — shared across all five pages */'
          if marker not in s:
              s += '\n\n'+marker+'\n.footer-brand .footer-logo{display:block;width:210px;height:88px;object-fit:contain;object-position:left center}\n@media(max-width:560px){.footer-brand .footer-logo{width:190px;height:82px}}\n'
              css.write_text(s, encoding='utf-8')
          PY
      - name: Commit footer change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about.html products.html distribution.html contact.html style.css
          git commit -m 'Use company logo in footer across all pages'
          git push
